# Build and push the image, then bump the tag in the prod overlay.
# ArgoCD watches k8s/overlays/prod and syncs the new tag to the cluster.
name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "argocd/**"
      - "**.md"

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/abhinandkakkadi/go-k8s-todos

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-tag:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # main is protected (PR required). The deploy key is the ruleset's only
      # bypass actor, so it can push the tag bump directly.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set image tag in prod overlay
        working-directory: k8s/overlays/prod
        run: kustomize edit set image "${IMAGE}=${IMAGE}:${{ needs.build-push.outputs.tag }}"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy: ${IMAGE}:${{ needs.build-push.outputs.tag }}"
          git push
