apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

replicas:
  - name: go-api
    count: 3

images:
  - name: ghcr.io/abhinandkakkadi/go-k8s-todos
    newTag: latest

patches:
  - target:
      kind: ConfigMap
      name: go-api-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: prod
      - op: replace
        path: /data/LOG_LEVEL
        value: info
