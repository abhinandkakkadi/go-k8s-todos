apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

replicas:
- count: 3
  name: go-api

images:
- name: ghcr.io/abhinandkakkadi/go-k8s-todos
  newName: ghcr.io/abhinandkakkadi/go-k8s-todos
  newTag: sha-87ac4dd

patches:
- patch: |-
    - op: replace
      path: /data/APP_ENV
      value: prod
    - op: replace
      path: /data/LOG_LEVEL
      value: info
  target:
    kind: ConfigMap
    name: go-api-config
