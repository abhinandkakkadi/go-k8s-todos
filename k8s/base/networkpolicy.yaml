# Default deny for the whole namespace, then allow only what is needed.
# kubectl port-forward goes through the kubelet, not the pod network, so it
# keeps working. Kubelet probes are not affected either.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Every pod may resolve DNS via CoreDNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# The API accepts traffic from pods in its own namespace only.
# Add the gateway/ingress namespace here once there is one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: go-api-ingress
spec:
  podSelector:
    matchLabels:
      app: go-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 8080 }
---
# Matching egress side: default-deny also blocks outgoing traffic, so pods in
# the namespace need this to reach the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-go-api
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: go-api
      ports:
        - { protocol: TCP, port: 8080 }
